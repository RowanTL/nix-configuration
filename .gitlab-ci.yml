update-lockfile:
  stage: build
  image: nixos/nix:latest
  script:
    - nix --extra-experimental-features "nix-command flakes" flake update
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git add flake.lock
    - git commit -m "Automated flake.lock update [skip ci]"
    - git push "https://project_${CI_PROJECT_ID}_bot:${PROJECT_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_REF_NAME}
  only:
    - schedules
